<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loading">
  <style>
    .f { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.1s ease-in-out infinite; }
    .f2 { animation-duration: 1.3s; animation-delay: -.4s; }
    .f3 { animation-duration: 1.2s; animation-delay: -.8s; }
    .lid { animation: blink 3.6s ease-in-out infinite; }
    @keyframes flick {
      0%, 100% { transform: scale(1, 1) skewX(0); }
      30% { transform: scale(.96, .84) skewX(-6deg); }
      60% { transform: scale(1.03, 1.08) skewX(4deg); }
    }
    @keyframes blink {
      0%, 86%, 100% { transform: translateY(0); }
      91% { transform: translateY(15px); }
    }
    @media (prefers-reduced-motion: reduce) { .f, .lid { animation: none; } }
  </style>
