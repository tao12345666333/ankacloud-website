name: staging

# GitHub Pages build of the site: a staging environment to review a pull request
# before it reaches the Cloudflare Workers production deployment. There is one
# Pages site, so the latest PR push wins. PRs from forks get a read-only token
# and skip the deploy.
# One-time setup: Settings → Pages → Source: "GitHub Actions", and allow PR refs
# (pattern "*/merge") in the github-pages environment's deployment branches.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # Pages serves the site under /<repo>/, so both the URL and the base path
      # change.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          PUBLIC_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          PUBLIC_STAGING: "1"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
